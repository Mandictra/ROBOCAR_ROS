; ===================================================================================
;  ROBOCAR_ROS - one project, several firmwares
;    robot firmware : src/main.cpp          -> environment  esp32-s3-devkitc-1   (the default)
;    PID test rig   : tools/PID_TEST.cpp    -> environment  pid_test
;    other sketches : tools/*.cpp           -> i2c_scanner, imu_calibrate, motor_id_test
;  Upload:  pio run -e pid_test -t upload     |     pio run -t upload   (robot)
;  RULE for lib_deps: every library goes on its own line, indented with 4 SPACES (not tabs, not flush left).
;  A line that is not indented is read as a new setting and gives "parse error".
; ===================================================================================
[platformio]
default_envs = esp32-s3-devkitc-1

; ---- settings shared by ALL environments (board, flash, PSRAM, port) ----
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0

board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------- robot firmware ----------------------------------
[env:esp32-s3-devkitc-1]
board_microros_transport = serial
board_microros_distro = jazzy
board_microros_user_meta = custom.meta

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
    waspinator/AccelStepper @ ^1.64
    madhephaestus/ESP32Servo @ ^3.0.5
    adafruit/Adafruit TCS34725 @ ^1.4.4
    madhephaestus/ESP32Encoder @ ^0.11.3
    tomstewart89/BasicLinearAlgebra @ ^5.1

; ------------------------- test sketches (no micro-ROS, own libraries) -------------------------
[env:pid_test]
build_src_filter = -<*> +<../tools/PID_TEST.cpp>
lib_deps =
    madhephaestus/ESP32Encoder @ ^0.11.3

[env:motor_id_test]
build_src_filter = -<*> +<../tools/motor_id_test.cpp>
lib_deps =
    madhephaestus/ESP32Encoder @ ^0.11.3

[env:i2c_scanner]
build_src_filter = -<*> +<../tools/I2C_SCANNER.cpp>

[env:imu_calibrate]
build_src_filter = -<*> +<../tools/IMU_CALIBRATE.cpp>