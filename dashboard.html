<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Sorter Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --danger: #ef4444; --success: #22c55e; --text: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; color: var(--accent); }
        #status { padding: 8px 16px; border-radius: 20px; background: #334155; font-weight: bold; font-size: 0.9rem; }
        .connected { color: var(--success); border: 1px solid var(--success); }
        .disconnected { color: var(--danger); border: 1px solid var(--danger); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background-color: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .card h2 { margin-top: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .data-box { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .data-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .data-val { font-size: 1.2rem; font-family: monospace; font-weight: bold; color: var(--accent); }
        .data-val.stale { color: #64748b; }
        .sensor-display { display: flex; align-items: center; justify-content: center; background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
        #ir-status { font-size: 1.5rem; font-weight: bold; color: var(--danger); letter-spacing: 1px; }

        .control-group { margin-bottom: 20px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
        .control-group.disabled { opacity: 0.4; }
        .control-note { font-size: 0.7rem; color: #64748b; margin-top: 4px; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        input[type=range]:disabled { cursor: not-allowed; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; background: #334155; color: white; }
        .btn:hover { background: #475569; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-emg { background: #991b1b; color: white; width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #f87171; animation: pulse-red 2s infinite; margin-bottom: 15px;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 10px; justify-content: center; }
        .d-btn { background: #334155; border: none; color: white; border-radius: 8px; font-size: 1.2rem; cursor: pointer; user-select: none; transition: 0.1s; touch-action: none; }
        .d-btn.active { background: var(--accent); color: #000; transform: scale(0.95); }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-stop { grid-column: 2; grid-row: 2; background: #475569; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Autonomous Sorter Dashboard</h1>
        <div id="status" class="disconnected">Waiting for ROSBridge...</div>
    </div>

    <div class="dashboard-grid">
        <!-- TELEMETRY PANEL -->
        <div class="card">
            <h2>Sensor Telemetry</h2>
            <div class="data-grid">
                <div class="data-box"><div class="data-label">Encoder FL</div><div id="enc-fl" class="data-val">0</div></div>
                <div class="data-box"><div class="data-label">Encoder FR</div><div id="enc-fr" class="data-val">0</div></div>
                <div class="data-box"><div class="data-label">Encoder RL</div><div id="enc-rl" class="data-val">0</div></div>
                <div class="data-box"><div class="data-label">Encoder RR</div><div id="enc-rr" class="data-val">0</div></div>
            </div>
            <div class="data-label" style="margin-top: 15px;">IR Trigger Sensor (Live)</div>
            <div class="sensor-display">
                <div id="ir-status">NO OBJECT</div>
            </div>
        </div>

        <!-- DRIVE PANEL -->
        <div class="card">
            <h2>Chassis Control</h2>
            <div class="control-group">
                <label><span>Speed Limit</span><span id="speed-val">0.5 m/s</span></label>
                <input type="range" min="0.1" max="1.0" step="0.1" value="0.5" onchange="updateMaxSpeed(this.value)">
            </div>
            <div class="d-pad">
                <button class="d-btn d-up" data-lin="-1" data-ang="0">W</button>
                <button class="d-btn d-left" data-lin="0" data-ang="-1">A</button>
                <button class="d-btn d-stop" onclick="drive(0, 0)">STOP</button>
                <button class="d-btn d-right" data-lin="0" data-ang="1">D</button>
                <button class="d-btn d-down" data-lin="1" data-ang="0">S</button>
            </div>
        </div>

        <!-- MANIPULATOR PANEL -->
        <div class="card">
            <h2>Sorting &amp; Actuators</h2>

            <button class="btn btn-emg" onclick="emergencyStop()">MASTER E-STOP</button>

            <div class="control-group">
                <label><span>Pan Camera (Positional)</span><span id="pan-val">90°</span></label>
                <input type="range" id="pan-slider" min="0" max="180" step="5" value="90" oninput="updatePan()">
            </div>

            <div class="control-group">
                <label><span>Dump Servo</span></label>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="setDump(175)">Dump Trash</button>
                    <button class="btn" onclick="setDump(5)">Reset Bin</button>
                </div>
            </div>

            <div class="control-group">
                <label><span>Stepper Motor (Conveyor)</span><span id="step-val">0 steps/s</span></label>
                <input type="range" id="stepper-slider" min="-700" max="700" step="50" value="0" oninput="updateStepper()">
                <div class="btn-group" style="margin-top: 10px;">
                    <button class="btn btn-primary" onclick="setStepper(700)">Max FWD</button>
                    <button class="btn btn-danger" onclick="setStepper(0)">STOP</button>
                    <button class="btn" onclick="setStepper(-700)">Max REV</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ---------- Connection (with auto-reconnect) ----------
        var ros = null;
        var statusEl = document.getElementById('status');
        var reconnectDelayMs = 1000;
        var lastTelemetryMs = 0;

        function connect() {
            ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

            ros.on('connection', function () {
                statusEl.innerText = "● ONLINE & LINKED";
                statusEl.className = "connected";
                reconnectDelayMs = 1000;
                attachTopics();
            });
            ros.on('error', function () {
                statusEl.innerText = "● CONNECTION ERROR";
                statusEl.className = "disconnected";
            });
            ros.on('close', function () {
                statusEl.innerText = "● OFFLINE — retrying...";
                statusEl.className = "disconnected";
                markTelemetryStale();
                setTimeout(connect, reconnectDelayMs);
                reconnectDelayMs = Math.min(reconnectDelayMs * 1.5, 10000);
            });
        }

        function markTelemetryStale() {
            ['enc-fl', 'enc-fr', 'enc-rl', 'enc-rr'].forEach(function (id) {
                document.getElementById(id).classList.add('stale');
            });
        }

        // ---------- Telemetry Subscribers ----------
        function attachTopics() {
            var encListener = new ROSLIB.Topic({ ros: ros, name: '/encoders', messageType: 'std_msgs/msg/Int32MultiArray' });
            encListener.subscribe(function (m) {
                lastTelemetryMs = Date.now();
                document.getElementById('enc-fl').innerText = m.data[0];
                document.getElementById('enc-rl').innerText = m.data[1];
                document.getElementById('enc-fr').innerText = m.data[2];
                document.getElementById('enc-rr').innerText = m.data[3];
                ['enc-fl', 'enc-fr', 'enc-rl', 'enc-rr'].forEach(function (id) {
                    document.getElementById(id).classList.remove('stale');
                });
            });

            var irListener = new ROSLIB.Topic({ ros: ros, name: '/ir_trigger', messageType: 'std_msgs/msg/Bool' });
            irListener.subscribe(function (m) {
                var irStatusEl = document.getElementById('ir-status');
                if (m.data === true) {
                    irStatusEl.innerText = "OBJECT DETECTED";
                    irStatusEl.style.color = "var(--success)";
                } else {
                    irStatusEl.innerText = "NO OBJECT";
                    irStatusEl.style.color = "var(--danger)";
                }
            });

            cmdVel = new ROSLIB.Topic({ ros: ros, name: '/cmd_vel', messageType: 'geometry_msgs/msg/Twist' });
            panTiltCmd = new ROSLIB.Topic({ ros: ros, name: '/pan_tilt_cmd', messageType: 'geometry_msgs/msg/Point' });
            dumpCmd = new ROSLIB.Topic({ ros: ros, name: '/dump_cmd', messageType: 'std_msgs/msg/Float32' });
            convCmd = new ROSLIB.Topic({ ros: ros, name: '/conveyor_cmd', messageType: 'std_msgs/msg/Float32' });
            speedCmd = new ROSLIB.Topic({ ros: ros, name: '/max_speed_cmd', messageType: 'std_msgs/msg/Float32' });
        }

        var cmdVel, panTiltCmd, dumpCmd, convCmd, speedCmd;

        function updateMaxSpeed(val) {
            document.getElementById('speed-val').innerText = val + " m/s";
            if (!speedCmd) return;
            speedCmd.publish(new ROSLIB.Message({ data: parseFloat(val) }));
        }

        function drive(lin, ang) {
            if (!cmdVel) return;
            cmdVel.publish(new ROSLIB.Message({ linear: { x: lin, y: 0, z: 0 }, angular: { x: 0, y: 0, z: ang } }));
        }

        function updatePan() {
            var currentPan = parseFloat(document.getElementById('pan-slider').value);
            document.getElementById('pan-val').innerText = currentPan + "°";
            if (panTiltCmd) panTiltCmd.publish(new ROSLIB.Message({ x: currentPan, y: 90.0, z: 0.0 }));
        }

        function setDump(angle) {
            if (dumpCmd) dumpCmd.publish(new ROSLIB.Message({ data: parseFloat(angle) }));
        }

        function updateStepper() {
            var speed = parseFloat(document.getElementById('stepper-slider').value);
            document.getElementById('step-val').innerText = speed + " steps/s";
            if (convCmd) convCmd.publish(new ROSLIB.Message({ data: speed }));
        }
        function setStepper(speed) {
            document.getElementById('stepper-slider').value = speed;
            updateStepper();
        }

        function emergencyStop() {
            drive(0, 0);
            setStepper(0);
        }

        // ---------- D-Pad: Pointer Events, safe against drag-off / interrupted touch ----------
        // Fixes: old onmousedown/onmouseup pairs never stopped the robot if the
        // pointer left the button before release (drag off, phone lock, alt-tab).
        document.querySelectorAll('.d-pad .d-btn:not(.d-stop)').forEach(function (btn) {
            var lin = parseFloat(btn.dataset.lin);
            var ang = parseFloat(btn.dataset.ang);
            var holdInterval = null;

            function start(e) {
                e.preventDefault();
                btn.setPointerCapture(e.pointerId);
                btn.classList.add('active');
                drive(lin, ang);
                // Keep re-sending while held - the firmware has a command
                // timeout failsafe that zeroes motors if it stops hearing
                // from us, so a single publish on press isn't enough for a
                // long hold. 150ms should be safely under CMD_TIMEOUT_MS;
                // check pins.h and shorten this further if it's tighter.
                if (holdInterval) clearInterval(holdInterval);
                holdInterval = setInterval(function () { drive(lin, ang); }, 150);
            }
            function stop(e) {
                btn.classList.remove('active');
                if (holdInterval) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                }
                drive(0, 0);
            }

            btn.addEventListener('pointerdown', start);
            btn.addEventListener('pointerup', stop);
            btn.addEventListener('pointercancel', stop);
            btn.addEventListener('lostpointercapture', stop);
        });

        // Belt-and-braces: if literally nothing else fires, releasing anywhere stops the robot.
        window.addEventListener('pointerup', function () {
            document.querySelectorAll('.d-pad .d-btn.active').forEach(function (b) {
                b.classList.remove('active');
            });
        });

        connect();
    </script>
</body>
</html>
